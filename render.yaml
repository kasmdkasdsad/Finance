# QuantPulse on Render — the Brain supervising the Alpaca PAPER account 24/7 (see RENDER.md).
#
#   quantpulse-api        the API + the Brain supervisor + background jobs, always on (1 CPU, 2 GB: the S&P 500
#                         stock model peaks near 1.5 GB). Exactly ONE instance: a database lease also guarantees
#                         one supervisor while old and new instances overlap during a deploy.
#   quantpulse-dashboard  the Streamlit dashboard (password login); free instance, sleeps when unused. It calls
#                         the API over Render's private network with the API token; the browser never sees it.
#   quantpulse-db         PostgreSQL 16: the Brain's whole history; private network only.
#
# Secrets are never in this file: `sync: false` values are asked for once in the Render dashboard, the API token
# is generated by Render, and the database URL comes from the database itself.
#
# Every push to the branch below deploys automatically once GitHub CI passes (lint, types, tests): build →
# pre-deploy (preflight, then migrations, once) → start → health check. A failed step keeps the previous version
# running. The API refuses to start unless the paper-only preflight passes.

services:
  - type: web
    name: quantpulse-api
    runtime: python
    plan: 1c-2g
    region: virginia
    numInstances: 1
    branch: claude/keen-tesla-y7rion
    autoDeployTrigger: checksPass
    buildCommand: pip install --upgrade pip && pip install . -c constraints.txt
    preDeployCommand: quantpulse-preflight && quantpulse-migrate
    startCommand: >-
      uvicorn --factory quantpulse.api.app:app_factory --host 0.0.0.0 --port $PORT
      --timeout-graceful-shutdown 20 --no-server-header
    healthCheckPath: /health
    maxShutdownDelaySeconds: 120
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - deploy/**
        - launcher/**
        - assets/**
    envVars:
      # --- paper only, the Brain owns the account (checked again by the preflight) -----------------
      - key: QP_DEPLOYMENT
        value: cloud
      - key: QP_ENVIRONMENT
        value: production
      - key: QP_ALPACA_PAPER
        value: "true"
      - key: QP_BRAIN_MODE
        value: paper_execution
      - key: QP_ALPACA_TRADING_ENABLED
        value: "true"
      - key: QP_TRADING_DRY_RUN
        value: "false"
      - key: QP_BRAIN_KILL_SWITCH
        value: "false"
      - key: QP_TRADING_KILL_SWITCH
        value: "false"
      - key: QP_TRADING_SCHEDULER_ENABLED
        value: "false"
      - key: QP_TRADING_SCHEDULER_REQUIRES_ARMING
        value: "true"
      - key: QP_BRAIN_SUPERVISOR_ENABLED
        value: "true"
      - key: QP_POLLING_ENABLED
        value: "true"
      - key: QP_ENABLE_LIVE_DATA
        value: "true"
      - key: QP_ALPACA_STOCK_FEED
        value: iex
      # --- runtime -----------------------------------------------------------------------------------
      - key: QP_AUTO_MIGRATE
        value: "false"
      - key: QP_LOG_JSON
        value: "true"
      - key: QP_LOG_LEVEL
        value: INFO
      - key: QP_SHUTDOWN_DRAIN_SECONDS
        value: "75"
      - key: QP_DATABASE_URL
        fromDatabase:
          name: quantpulse-db
          property: connectionString
      # --- secrets -------------------------------------------------------------------------------------
      - key: QP_API_TOKEN
        generateValue: true
      - key: QP_ALPACA_API_KEY_ID
        sync: false
      - key: QP_ALPACA_API_SECRET_KEY
        sync: false
      - key: QP_SEC_USER_AGENT
        sync: false

  - type: web
    name: quantpulse-dashboard
    runtime: python
    plan: free
    region: virginia
    branch: claude/keen-tesla-y7rion
    autoDeployTrigger: checksPass
    buildCommand: pip install --upgrade pip && pip install ".[frontend]" -c constraints.txt
    startCommand: >-
      streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    buildFilter:
      ignoredPaths:
        - "**/*.md"
        - deploy/**
        - launcher/**
    envVars:
      - key: QP_DEPLOYMENT
        value: cloud
      - key: QP_API_URL
        fromService:
          type: web
          name: quantpulse-api
          property: hostport
      - key: QP_API_TOKEN
        fromService:
          type: web
          name: quantpulse-api
          envVarKey: QP_API_TOKEN
      - key: QP_DASHBOARD_PASSWORD
        sync: false
      - key: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
        value: "true"
      - key: STREAMLIT_CLIENT_SHOW_ERROR_DETAILS
        value: "false"
      - key: STREAMLIT_CLIENT_TOOLBAR_MODE
        value: viewer
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: STREAMLIT_SERVER_FILE_WATCHER_TYPE
        value: none

databases:
  - name: quantpulse-db
    plan: 0.1c-256mb
    region: virginia
    postgresMajorVersion: "16"
    databaseName: quantpulse
    user: quantpulse
    diskSizeGB: 5
    ipAllowList: []  # no access from the internet: only the services above, over the private network
